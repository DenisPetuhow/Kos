<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <radialGradient id="earth2" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="100%" stop-color="#1c6dc0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="460" fill="#fafcff"/>
  <!-- Эллипс орбиты -->
  <ellipse cx="390" cy="225" rx="290" ry="185" fill="none" stroke="#2c3e50" stroke-width="2.4"/>
  <!-- Большая ось -->
  <line x1="100" y1="225" x2="680" y2="225" stroke="#aab4be" stroke-width="1.2" stroke-dasharray="5 5"/>
  <!-- Центр эллипса -->
  <circle cx="390" cy="225" r="3.5" fill="#555"/>
  <text x="390" y="248" text-anchor="middle" font-size="14" fill="#555">центр эллипса</text>
  <!-- Земля в фокусе -->
  <circle cx="613" cy="225" r="26" fill="url(#earth2)" stroke="#155a9c" stroke-width="2"/>
  <text x="613" y="270" text-anchor="middle" font-size="14" fill="#155a9c" font-weight="bold">Земля (в фокусе!)</text>
  <!-- Перигей и апогей -->
  <circle cx="680" cy="225" r="5" fill="#c0392b"/>
  <text x="690" y="212" font-size="15" fill="#c0392b" font-weight="bold">перигей</text>
  <text x="690" y="230" font-size="13" fill="#c0392b">ближе всего,</text>
  <text x="690" y="246" font-size="13" fill="#c0392b">быстрее всего</text>
  <circle cx="100" cy="225" r="5" fill="#7048b0"/>
  <text x="18" y="205" font-size="15" fill="#7048b0" font-weight="bold">апогей</text>
  <text x="8" y="223" font-size="13" fill="#7048b0">дальше всего,</text>
  <text x="8" y="239" font-size="13" fill="#7048b0">медленнее всего</text>
  <!-- Спутник и радиус-вектор -->
  <circle cx="535" cy="65" r="7" fill="#2c3e50"/>
  <text x="548" y="56" font-size="15" fill="#2c3e50" font-weight="bold">КА</text>
  <line x1="613" y1="225" x2="535" y2="65" stroke="#1a7a3c" stroke-width="2.2"/>
  <text x="588" y="140" font-size="16" fill="#1a7a3c" font-weight="bold">r</text>
  <!-- Истинная аномалия -->
  <path d="M 653 225 A 40 40 0 0 0 631.5 188.5" fill="none" stroke="#e67e22" stroke-width="2.4"/>
  <text x="655" y="192" font-size="17" fill="#e67e22" font-weight="bold">ν</text>
  <text x="620" y="176" font-size="13" fill="#e67e22">истинная аномалия —</text>
  <text x="620" y="161" font-size="13" fill="#e67e22">угол от перигея</text>
  <!-- размер a -->
  <line x1="390" y1="300" x2="680" y2="300" stroke="#555" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="390" y1="292" x2="390" y2="308" stroke="#555" stroke-width="1.4"/>
  <text x="522" y="322" font-size="16" fill="#555" font-weight="bold">a — большая полуось</text>
  <!-- размер c -->
  <line x1="390" y1="200" x2="613" y2="200" stroke="#9b59b6" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="465" y="192" font-size="15" fill="#9b59b6" font-weight="bold">c = a·e</text>
  <!-- Формулы -->
  <text x="60" y="380" font-size="16" fill="#2c3e50">Эксцентриситет:  e = c / a   (0 — окружность, ближе к 1 — сильно вытянутый эллипс)</text>
  <text x="60" y="408" font-size="16" fill="#2c3e50">Радиус в перигее:  r_п = a·(1 − e)        Радиус в апогее:  r_а = a·(1 + e)</text>
  <text x="60" y="436" font-size="16" fill="#2c3e50">Текущий радиус:  r = a·(1 − e·cos E),  где E — эксцентрическая аномалия (раздел 6)</text>
</svg>
