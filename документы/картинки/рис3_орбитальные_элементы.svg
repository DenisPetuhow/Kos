<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <radialGradient id="earth3" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="100%" stop-color="#1c6dc0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="520" fill="#fafcff"/>

  <!-- Плоскость экватора (перспектива) -->
  <ellipse cx="400" cy="270" rx="310" ry="95" fill="#1c6dc0" fill-opacity="0.10" stroke="#1c6dc0" stroke-width="1.6"/>
  <text x="118" y="330" font-size="15" fill="#1c6dc0" font-weight="bold">плоскость экватора</text>

  <!-- Плоскость орбиты (наклонена) -->
  <g transform="rotate(-24 400 270)">
    <ellipse cx="400" cy="270" rx="295" ry="118" fill="#e67e22" fill-opacity="0.10" stroke="#e67e22" stroke-width="2"/>
  </g>
  <text x="565" y="105" font-size="15" fill="#e67e22" font-weight="bold">плоскость орбиты</text>

  <!-- Земля в центре -->
  <circle cx="400" cy="270" r="42" fill="url(#earth3)" stroke="#155a9c" stroke-width="2"/>

  <!-- Направление на точку весеннего равноденствия -->
  <line x1="400" y1="270" x2="770" y2="270" stroke="#555" stroke-width="1.8" marker-end="url(#arr3)"/>
  <text x="672" y="256" font-size="15" fill="#555">♈ точка весеннего</text>
  <text x="672" y="292" font-size="15" fill="#555">равноденствия</text>

  <!-- Линия узлов: пересечение плоскостей. Для наклона -24° вокруг (400,270) точки большой оси орбиты лежат на линии узлов -->
  <line x1="130" y1="380" x2="670" y2="160" stroke="#7048b0" stroke-width="1.6" stroke-dasharray="7 5"/>
  <!-- Восходящий узел -->
  <circle cx="670" cy="160" r="6" fill="#7048b0"/>
  <text x="683" y="152" font-size="15" fill="#7048b0" font-weight="bold">☊ восходящий узел</text>
  <text x="683" y="171" font-size="13" fill="#7048b0">(КА пересекает экватор</text>
  <text x="683" y="188" font-size="13" fill="#7048b0">снизу вверх)</text>

  <!-- Угол Ω между направлением ♈ и линией узлов -->
  <path d="M 500 270 A 100 100 0 0 0 490.7 233.1" fill="none" stroke="#7048b0" stroke-width="2.4"/>
  <text x="512" y="247" font-size="18" fill="#7048b0" font-weight="bold">Ω</text>

  <!-- Угол наклонения i у узла: между краем экваторной и орбитальной плоскостей -->
  <path d="M 610 184 A 65 65 0 0 0 594 148" fill="none" stroke="#e67e22" stroke-width="2.4"/>
  <text x="614" y="140" font-size="18" fill="#e67e22" font-weight="bold">i</text>
  <text x="600" y="120" font-size="13" fill="#e67e22">наклонение</text>

  <!-- Перигей на орбите и угол ω -->
  <circle cx="212" cy="140" r="6" fill="#c0392b"/>
  <text x="150" y="120" font-size="15" fill="#c0392b" font-weight="bold">перигей</text>
  <line x1="400" y1="270" x2="212" y2="140" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M 322 302 A 84 84 0 0 1 336 226" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="288" y="248" font-size="18" fill="#c0392b" font-weight="bold">ω</text>

  <!-- КА на орбите -->
  <circle cx="530" cy="356" r="7" fill="#2c3e50"/>
  <text x="543" y="372" font-size="15" fill="#2c3e50" font-weight="bold">КА</text>

  <!-- Легенда -->
  <text x="30" y="440" font-size="15" fill="#2c3e50" font-weight="bold">Шесть элементов орбиты:</text>
  <text x="30" y="464" font-size="14.5" fill="#2c3e50">a, e — размер и форма эллипса (рис. 2)      i — наклон плоскости орбиты к экватору</text>
  <text x="30" y="486" font-size="14.5" fill="#2c3e50">Ω — куда «повёрнута» плоскость (угол от ♈ до узла)      ω — где в плоскости лежит перигей</text>
  <text x="30" y="508" font-size="14.5" fill="#2c3e50">M (или ν) — где на эллипсе находится сам КА в данный момент времени</text>
</svg>
