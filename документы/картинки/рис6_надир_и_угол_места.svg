<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="earth6" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#bfe3ff"/>
      <stop offset="100%" stop-color="#7db8e8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="540" fill="#fafcff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" fill="#2c3e50" font-weight="bold">Один и тот же луч КА–наблюдатель, но ТРИ разных угла</text>

  <!-- Земля -->
  <circle cx="380" cy="470" r="210" fill="url(#earth6)" fill-opacity="0.5" stroke="#155a9c" stroke-width="2.4"/>
  <circle cx="380" cy="470" r="4" fill="#155a9c"/>
  <text x="392" y="486" font-size="15" fill="#155a9c" font-weight="bold">O — центр Земли</text>

  <!-- Наблюдатель P на поверхности -->
  <circle cx="300" cy="276" r="6" fill="#1a5fb4"/>
  <text x="212" y="270" font-size="15" fill="#1a5fb4" font-weight="bold">P — БПЛА</text>

  <!-- Спутник S -->
  <circle cx="455" cy="46" r="8" fill="#2c3e50"/>
  <text x="470" y="42" font-size="16" fill="#2c3e50" font-weight="bold">S — КА</text>

  <!-- Стороны треугольника -->
  <line x1="380" y1="470" x2="300" y2="276" stroke="#155a9c" stroke-width="2"/>
  <text x="308" y="382" font-size="16" fill="#155a9c" font-weight="bold">R</text>
  <line x1="380" y1="470" x2="455" y2="46" stroke="#555" stroke-width="2"/>
  <text x="432" y="300" font-size="16" fill="#555" font-weight="bold">R + h</text>
  <line x1="300" y1="276" x2="455" y2="46" stroke="#c0392b" stroke-width="2.6"/>
  <text x="342" y="150" font-size="16" fill="#c0392b" font-weight="bold">d — луч связи</text>

  <!-- Горизонт наблюдателя: перпендикуляр к OP в точке P -->
  <line x1="189" y1="322" x2="411" y2="230" stroke="#1a5fb4" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="120" y="340" font-size="14" fill="#1a5fb4">горизонт БПЛА</text>
  <text x="120" y="358" font-size="13" fill="#1a5fb4">(⊥ к радиусу OP)</text>

  <!-- Угол места ε у P: между горизонтом (в сторону S) и лучом PS -->
  <path d="M 384 241 A 90 90 0 0 1 350 201" fill="none" stroke="#1a5fb4" stroke-width="2.6"/>
  <text x="386" y="206" font-size="19" fill="#1a5fb4" font-weight="bold">ε</text>
  <text x="472" y="218" font-size="14" fill="#1a5fb4" font-weight="bold">ε — угол МЕСТА:</text>
  <text x="472" y="236" font-size="13.5" fill="#1a5fb4">насколько высоко КА</text>
  <text x="472" y="253" font-size="13.5" fill="#1a5fb4">над горизонтом БПЛА</text>

  <!-- Надирный угол γ у S: между S→O и S→P -->
  <path d="M 442.6 116.4 A 71.4 71.4 0 0 1 415.1 105.2" fill="none" stroke="#e67e22" stroke-width="2.6"/>
  <text x="412" y="132" font-size="19" fill="#e67e22" font-weight="bold">γ</text>
  <text x="562" y="96" font-size="14" fill="#e67e22" font-weight="bold">γ — НАДИРНЫЙ угол:</text>
  <text x="562" y="114" font-size="13.5" fill="#e67e22">отклонение луча от оси</text>
  <text x="562" y="131" font-size="13.5" fill="#e67e22">«КА → центр Земли».</text>
  <text x="562" y="148" font-size="13.5" fill="#e67e22">Именно с ним сравнивает</text>
  <text x="562" y="165" font-size="13.5" fill="#e67e22">конус и линии программа</text>

  <!-- Центральный угол λ у O -->
  <path d="M 349.5 396 A 80 80 0 0 1 394.2 391.3" fill="none" stroke="#7048b0" stroke-width="2.6"/>
  <text x="356" y="424" font-size="18" fill="#7048b0" font-weight="bold">λ</text>
  <text x="52" y="452" font-size="14" fill="#7048b0" font-weight="bold">λ — центральный угол:</text>
  <text x="52" y="470" font-size="13.5" fill="#7048b0">дуга от подспутниковой</text>
  <text x="52" y="487" font-size="13.5" fill="#7048b0">точки до БПЛА</text>

  <!-- Формулы -->
  <rect x="490" y="330" width="290" height="150" rx="10" fill="#fff8ee" stroke="#e0c9a0" stroke-width="1.4"/>
  <text x="508" y="360" font-size="15.5" fill="#2c3e50" font-weight="bold">Связи между углами:</text>
  <text x="508" y="392" font-size="16" fill="#2c3e50">γ + ε + λ = 90°</text>
  <text x="508" y="424" font-size="16" fill="#2c3e50">sin γ = R·cos ε / (R + h)</text>
  <text x="508" y="456" font-size="13.5" fill="#666">(теорема синусов для △ OPS)</text>
</svg>
